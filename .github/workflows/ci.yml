name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_APP_URL: https://example.invalid
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  database:
    name: Database isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Start local Supabase without printing local credentials
        run: npx supabase start >"$RUNNER_TEMP/supabase-start.log" 2>&1

      - name: Reset migrations and seed
        run: npx supabase db reset --local

      - name: Test database isolation
        run: npm run db:test

      - name: Check generated database types
        run: npm run db:types:check

      - name: Lint database functions
        run: npm run db:lint

      - name: Run local database advisors
        run: |
          npm run db:advisors:security
          npm run db:advisors:performance

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check repository safety
        run: node scripts/check-repository-safety.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build production application
        run: npm run build

  e2e:
    name: Authenticated browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Start local Supabase without printing local credentials
        run: npx supabase start >"$RUNNER_TEMP/supabase-start.log" 2>&1

      - name: Reset local authentication and database
        run: npx supabase db reset --local

      - name: Configure the public local test boundary
        shell: bash
        run: |
          npx supabase status -o env >"$RUNNER_TEMP/supabase-status.env" 2>/dev/null || true
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          test -n "$API_URL"
          test -n "$PUBLISHABLE_KEY"
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "AUTH_E2E_ENABLED=true"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
          } >>"$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/supabase-status.env"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke, accessibility and authenticated journey tests
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
