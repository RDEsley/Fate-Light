name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 * * *" # runs every day at 00:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate Secrets
        run: |
          set -euo pipefail
          
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ Error: SUPABASE_URL secret not set"
            exit 1
          fi
          
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "❌ Error: SUPABASE_ANON_KEY secret not set"
            exit 1
          fi
          
          echo "✓ Secrets validated"

      - name: Ping Supabase Health Check
        run: |
          set -euo pipefail

          # Setup variables
          BASE_URL="${{ secrets.SUPABASE_URL }}"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          PING_PATH="${{ secrets.SUPABASE_PING_PATH || 'rest/v1/racas?select=raca_id&limit=1' }}"
          
          # Clean URLs
          BASE_URL=$(echo "${BASE_URL}" | sed 's|/$||')
          PING_PATH=$(echo "${PING_PATH}" | sed 's|^/||')
          
          ENDPOINT="${BASE_URL}/${PING_PATH}"
          
          echo "📍 Endpoint: ${ENDPOINT}"
          echo "🔄 Attempting connection..."
          
          # Use -w to show HTTP status code
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 3 \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            "${ENDPOINT}" 2>&1 || true)
          
          echo "HTTP Status: ${HTTP_STATUS}"
          
          if [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "206" ]; then
            echo "✅ Supabase is alive!"
            exit 0
          elif [ "${HTTP_STATUS}" = "401" ] || [ "${HTTP_STATUS}" = "403" ]; then
            echo "❌ Authentication failed (${HTTP_STATUS})"
            echo "   Check SUPABASE_ANON_KEY secret"
            exit 1
          elif [ "${HTTP_STATUS}" = "521" ] || [ "${HTTP_STATUS}" = "522" ] || [ "${HTTP_STATUS}" = "523" ]; then
            echo "⚠️  Supabase temporarily unavailable (${HTTP_STATUS})"
            echo "   This is usually temporary. The workflow will retry."
            exit 0  # Don't fail on Supabase downtime
          else
            echo "⚠️  Unexpected status: ${HTTP_STATUS}"
            exit 0  # Don't fail - might be false positive
          fi

      - name: Full Verbose Test (on failure only)
        if: failure()
        run: |
          echo "Running verbose diagnostics..."
          curl -v \
            --connect-timeout 15 \
            --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/racas?select=raca_id&limit=1" 2>&1 || true
          
          echo ""
          echo "Network diagnostics:"
          ping -c 2 8.8.8.8 || true
          nslookup $(echo "${{ secrets.SUPABASE_URL }}" | cut -d/ -f3) || true
